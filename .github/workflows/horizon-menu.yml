name: Build Horizon Menu
on:
  push:
    branches: [codex/horizon-menu]
    paths:
      - 'addons/horizon-menu/**'
      - '.github/workflows/horizon-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - name: Install packager from this checkout
        run: cargo install --path crates/cargo-horizon-mod --locked
      - name: Format and unit tests
        working-directory: addons/horizon-menu
        run: |
          cargo fmt
          cargo test --lib
      - name: Build and sandbox checks
        working-directory: addons/horizon-menu
        run: |
          cargo horizon-mod build
          cargo horizon-mod test
          cargo horizon-mod check target/horizon-mod/horizon_menu.hmod
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-menu-hmod
          path: addons/horizon-menu/target/horizon-mod/horizon_menu.hmod
          if-no-files-found: error

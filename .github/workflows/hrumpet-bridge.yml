name: Hrumpet bridge
on:
  push:
    branches: [prototype/hrumpet]
    paths: ['hrumpet/bridge/**','.github/workflows/hrumpet-bridge.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bash hrumpet/bridge/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hrumpet-linux-jdk25
          path: |
            hrumpet/bridge/build/hrumpet
            hrumpet/bridge/build/host
            hrumpet/bridge/build/square.jar
            hrumpet/bridge/build/frame.ppm
